
<html>
<head>
  <title>WORD GO!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP CONTROLS -->
  <div id="top-bar">
    <button id="help-btn">Help</button>
    <button id="skip-btn">Skip (-5 pts)</button>
  </div>

  <!-- APP TITLE -->
  <h1 id="app-title">WORD GO!</h1>

  <!-- THEME & CLUE -->
  <p id="theme-heading">Theme: Famous Landmarks</p>
  <p id="clue-text"></p>

  <!-- GUESS BOXES (4 ROWS) -->
  <div id="board">
    <div class="guess-row active-row">
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
    </div>
    <div class="guess-row">
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
    </div>
    <div class="guess-row">
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
    </div>
    <div class="guess-row">
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
      <div class="letter-box"></div>
    </div>
  </div>

  <!-- MESSAGE FEEDBACK AREA -->
  <p id="message"></p>

  <!-- ON-SCREEN KEYPAD -->
  <div id="keypad">
    <button class="key">P</button>
    <button class="key">A</button>
    <button class="key">R</button>
    <button class="key">I</button>
    <button class="key">S</button>
  </div>

  <!-- SCRIPT CONNECTION -->
  <script src="script.js"></script>
</body>
</html>
